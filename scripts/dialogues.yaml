# Тестовые звонки вымышленной компании «СтройДом».
# Менеджер звучит в левом канале, клиент — в правом.
# expect — что должна найти проверка по чек-листу по умолчанию (используется в tests/test_dialogues.py):
#   grade — ожидаемая оценка: good / not_good / bad; loss — пункт, на котором звонок теряется (null — потерь нет).
calls:
  - file: ivanov_2026-10-12_1530
    title: Хороший звонок, возражение отработано
    expect: {grade: good, loss: null}
    lines:
      - manager: Здравствуйте! Меня зовут Алексей, компания СтройДом. Чем могу помочь?
      - client: Добрый день. Хочу сделать ремонт на кухне, нужен ламинат.
      - manager: Понятно. Какая у вас площадь кухни и что сейчас лежит на полу?
      - client: Около двенадцати метров, старый линолеум.
      - manager: А как вы пользуетесь кухней? Есть ли дети или животные?
      - client: Да, у нас собака, и пол приходится часто мыть.
      - manager: Тогда я предлагаю влагостойкий ламинат с плотным замком. Он хорошо переносит воду.
      - client: Понятно. Но дороговато получается.
      - manager: Давайте посчитаем вместе. Такой пол прослужит много лет, а гарантия от производителя длинная.
      - client: Ну ладно, это уже интереснее.
      - manager: Давайте я запишу вас на замер. Вам удобно в четверг в одиннадцать?
      - client: В четверг подойдёт.
      - manager: Отлично, мастер приедет в четверг в одиннадцать. Спасибо за звонок, всего доброго!
      - client: До свидания.

  - file: petrova_2026-10-13_1015
    title: Без выявления потребности
    expect: {grade: bad, loss: need}
    lines:
      - manager: Добрый день, компания СтройДом, меня зовут Ольга.
      - client: Здравствуйте. Мне нужна плитка в ванную.
      - manager: Вы уже выбирали плитку?
      - client: Нет, пока только смотрю.
      - manager: Понятно. Вам нужна глянцевая?
      - client: Наверное, я ещё не знаю.
      - manager: Тогда я предлагаю нашу плитку из каталога, она многим подходит.
      - client: Хорошо. А где можно посмотреть?
      - manager: Всё есть в каталоге на сайте. Если понадобится, звоните нам.
      - client: Ладно, понятно.
      - manager: Всего доброго, до свидания.

  - file: sidorov_2026-10-14_1400
    title: Проваленное возражение
    expect: {grade: bad, loss: objection}
    lines:
      - manager: Здравствуйте! СтройДом, меня зовут Сергей.
      - client: Добрый день. Хочу заказать окна в квартиру.
      - manager: Какие окна вы ищете и сколько их нужно?
      - client: Три окна, обычные, в спальню и в детскую.
      - manager: Что для вас главное, тепло или тишина?
      - client: Тишина, у нас рядом дорога.
      - manager: Тогда я рекомендую двухкамерный пластиковый профиль. Он хорошо глушит шум.
      - client: Понятно. А сколько это будет стоить?
      - manager: Три окна выйдут примерно в сорок пять тысяч рублей.
      - client: Ой, дороговато. Я пока подумаю.
      - manager: Ну, это наша цена, дешевле не получится.
      - client: Понятно, тогда я позже позвоню.
      - manager: Хорошо, до свидания.

  - file: ivanov_2026-10-15_1145
    title: Вежливый звонок без следующего шага
    expect: {grade: not_good, loss: next_step}
    lines:
      - manager: Добрый день! Компания СтройДом, меня зовут Игорь.
      - client: Здравствуйте. Хочу узнать про натяжные потолки.
      - manager: Конечно. В какой комнате вы хотите потолок и какая там высота?
      - client: В гостиной, высота обычная.
      - manager: А какой цвет вам нравится? И нужны ли светильники?
      - client: Белый матовый, и светильники нужны.
      - manager: Тогда я рекомендую матовое полотно со встроенными светильниками. Оно смотрится очень аккуратно.
      - client: Звучит хорошо. Спасибо, всё понятно.
      - manager: Рад помочь. Если появятся вопросы, звоните нам. До свидания!
      - client: До свидания.

  - file: petrova_2026-10-16_0930
    title: Хороший звонок без возражения
    expect: {grade: good, loss: null}
    lines:
      - manager: Здравствуйте! Меня зовут Ольга, компания СтройДом. Слушаю вас.
      - client: Добрый день. Нужна консультация по тёплому полу в спальню.
      - manager: Конечно. Какая у вас спальня по размеру и какое там покрытие?
      - client: Двенадцать метров, будет ламинат.
      - manager: А для чего вам тёплый пол? Это основное отопление или для комфорта?
      - client: Для комфорта, чтобы утром ноги не мёрзли.
      - manager: Тогда я предлагаю электрический нагревательный мат под ламинат. Он вам подойдёт.
      - client: А кто его устанавливает?
      - manager: Наш мастер. Давайте я запишу вас на замер, он приедет и всё посмотрит.
      - client: Давайте. А когда можно?
      - manager: Могу в среду в десять утра. Вам удобно?
      - client: Да, в среду подойдёт.
      - manager: Тогда записала. Спасибо за звонок, хорошего дня!
      - client: Спасибо, до свидания.
