# Чек-лист скрипта продаж CallScope.
# Порядок пунктов = порядок этапов скрипта: первый проваленный пункт — «этап потери».
#
# Поля пункта:
#   id            — латиница, уникальный
#   title         — название по-русски
#   weight        — вес в итоговом балле (> 0)
#   speaker       — чья речь проверяется: manager или client (по умолчанию manager)
#   phrases       — ключевые фразы; ищутся по начальным формам слов
#   statement_phrases — как phrases, но засчитываются только в утверждении: не в вопросе
#                   и без «не»/«нет» в той же части предложения («Вам нужен счёт?» — нет)
#   synonyms      — слово → замены; расширяют phrases
#   window        — где искать: all (весь звонок), first (первые реплики), last (последние)
#   window_size   — сколько реплик speaker в окне first/last (по умолчанию 3)
#   min_matches   — сколько разных реплик должны совпасть (по умолчанию 1)
#   rule          — phrases (ключевые фразы) или open_questions (открытые вопросы:
#                   вопрос начинается с вопросительного слова из phrases)
#   trigger       — фразы клиента; если задано, пункт проверяется только когда клиент
#                   их произнёс, иначе «не применим»
#   respond_within — в скольких следующих репликах менеджер должен ответить (по умолчанию 2)
#   description   — смысл пункта (для смысловой проверки моделью)

# Общие синонимы для всех пунктов.
synonyms:
  стоимость: [цена]
  замер: [обмер, выезд замерщика]
  скидка: [скидочка]

items:
  - id: greeting
    title: Приветствие и представление
    weight: 5
    window: first
    window_size: 2
    phrases:
      - здравствуйте
      - добрый день
      - добрый вечер
      - доброе утро
      - меня зовут
      - компания
      - СтройДом
    synonyms:
      здравствуйте: [приветствую]
    description: >-
      В начале звонка менеджер здоровается и представляется: называет своё имя
      и компанию.

  - id: need
    title: Выявление потребности (открытые вопросы)
    weight: 20
    rule: open_questions
    synonyms:
      как: [каким образом]
      какой: [каков]
    min_matches: 2
    phrases:
      - какой
      - как
      - что
      - сколько
      - где
      - когда
      - зачем
      - почему
      - для чего
      - каким образом
      - чем
    description: >-
      Менеджер задаёт клиенту открытые вопросы (не «да/нет»): что за объект,
      какая площадь, какие задачи, бюджет и сроки, — чтобы понять потребность.

  - id: solution
    title: Предложение решения
    weight: 15
    phrases:
      - предлагаю
      - можем предложить
      - рекомендую
      - советую
      - вам подойдет
      - подойдет
      - оптимальный вариант
      - лучше всего
      - под вашу задачу
      - для вашего
    synonyms:
      предлагаю: [предложение]
      рекомендую: [посоветую]
    description: >-
      Менеджер предлагает конкретный товар или услугу и связывает предложение
      с тем, что рассказал клиент.

  - id: objection
    title: Отработка возражения
    weight: 30
    trigger:
      - дорого
      - дороговато
      - подумаю
      - надо подумать
      - не уверен
      - сомневаюсь
      - у конкурентов дешевле
      - у других дешевле
      - в другом месте дешевле
      - нашел дешевле
      - видел дешевле
      - слишком дорого
      - не готов
      - посоветоваться
      - нет бюджета
      - не по карману
      - высокая цена
      - предлагали дешевле
      - в другой фирме дешевле
      - в другой компании дешевле
    respond_within: 2
    synonyms:
      рассрочка: [оплата частями]
      гарантия: [гарантийный срок]
      конкурентов: [других компаний]
    phrases:
      - скидка
      - рассрочка
      - гарантия
      - выгода
      - выгодно
      - сэкономите
      - экономия
      - окупится
      - прослужит
      - срок службы
      - качество
      - сертификат
      - входит в стоимость
      - бесплатно
      - бесплатный
      - акция
      - в подарок
      - сравните
      - разница в цене
      - альтернатива
      - бюджетный вариант
      - давайте посчитаем
      - что вас смущает
      - какие сомнения
    description: >-
      Если клиент возразил («дорого», «подумаю», «у конкурентов дешевле»), менеджер
      в ближайших репликах отвечает по существу: аргументы ценности, скидка,
      рассрочка, гарантия, альтернативный вариант, уточнение сомнений.

  - id: next_step
    title: Следующий шаг
    weight: 25
    phrases:
      - встреча
      - встретимся
      - приедет
      - встречаемся
      - запишу вас
      - записываю вас
      - я отправлю
      - отправлю вам
      - я вышлю
      - вышлю вам
      - я пришлю
      - пришлю вам
      - я перезвоню
      - перезвоню вам
      - я вам перезвоню
      - созвонимся в
      - оформим
      - оформить заказ
      - когда вам удобно
      - в какое время удобно
      - жду вас
    statement_phrases:
      - замер
      - замерщик
      - счет
      - договор
      - коммерческое предложение
      - смету
    synonyms:
      замер: [выезд на объект]
      счет: [счет на оплату]
    description: >-
      Менеджер договаривается о конкретном следующем шаге: замер, встреча,
      отправка сметы или счёта, оформление заказа, звонок в назначенное время.

  - id: farewell
    title: Прощание
    weight: 5
    window: last
    window_size: 2
    phrases:
      - до свидания
      - всего доброго
      - всего хорошего
      - хорошего дня
      - хорошего вечера
      - спасибо за звонок
      - спасибо за обращение
      - до встречи
    synonyms:
      до свидания: [до связи]
    description: Менеджер вежливо завершает разговор и прощается.
