[project]
name = "callscope"
version = "1.0.0"
description = "Локальная речевая аналитика звонков отдела продаж"
requires-python = ">=3.11,<3.15"
dependencies = [
    "faster-whisper>=1.0",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "Jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
callscope = "callscope.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callscope"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: медленный тест с настоящей моделью (CALLSCOPE_SLOW=1)"]
